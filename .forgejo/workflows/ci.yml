name: v2 validation

on:
  push:
    branches:
      - v2-dev
      - 'feature/v2-*'
  pull_request:
    branches:
      - v2-dev

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP ${{ matrix.php }}
        run: |
          apt-get update -qq
          apt-get install -y -qq software-properties-common ca-certificates
          add-apt-repository -y ppa:ondrej/php
          apt-get update -qq
          apt-get install -y -qq php${{ matrix.php }}-cli php${{ matrix.php }}-sqlite3
          update-alternatives --set php /usr/bin/php${{ matrix.php }}
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: v2 test suites
        run: |
          set -e
          for f in tests/v2/*.php; do
            echo "::group::$f"
            php "$f"
            echo "::endgroup::"
          done
      - name: v2 coding style (FND-011)
        # Scoped to classes/v2 + tests/v2 only: legacy v1 files predate
        # this ruleset and have not been reformatted (a separate,
        # out-of-scope change); gating only the actively developed v2
        # surface is the real, honest boundary rather than a repo-wide
        # gate that would fail on unrelated legacy code today.
        run: |
          curl -sL -o /tmp/php-cs-fixer.phar https://cs.symfony.com/download/php-cs-fixer-v3.phar
          php /tmp/php-cs-fixer.phar fix --dry-run --diff --config=.php-cs-fixer.php --path-mode=intersection -- classes/v2 tests/v2
      - name: Release-source guards
        run: |
          test -f LICENSE
          test -f version.xml
          grep -q '<application>chatwootIntegration</application>' version.xml
          grep -q 'SPDX-License-Identifier: GPL-3.0-or-later' LICENSE
