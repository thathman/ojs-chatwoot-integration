name: v2 validation

on:
  push:
    branches:
      - v2-dev
      - 'feature/v2-*'
  pull_request:
    branches:
      - v2-dev

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Foundation contracts
        run: php tests/v2/foundation.php
      - name: Runtime bootstrap
        run: php tests/v2/runtime-bootstrap.php
      - name: Runtime context
        run: php tests/v2/runtime-context.php
      - name: Context projector
        run: php tests/v2/context-projector.php
      - name: Relationship foundation
        run: php tests/v2/relationship.php
      - name: Capability policy
        run: php tests/v2/capability.php
      - name: Support session
        run: php tests/v2/support-session.php
      - name: Chatwoot binding
        run: php tests/v2/chatwoot-binding.php
      - name: Live plugin shell
        run: php tests/v2/live-plugin.php
      - name: Release-source guards
        run: |
          test -f LICENSE
          test -f version.xml
          grep -q '<application>chatwootIntegration</application>' version.xml
          grep -q 'SPDX-License-Identifier: GPL-3.0-or-later' LICENSE
