name: v2 validation

on:
  push:
    branches:
      - v2-dev
      - 'feature/v2-*'
  pull_request:
    branches:
      - v2-dev

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP ${{ matrix.php }}
        run: |
          apt-get update -qq
          apt-get install -y -qq software-properties-common ca-certificates
          add-apt-repository -y ppa:ondrej/php
          apt-get update -qq
          apt-get install -y -qq php${{ matrix.php }}-cli
          update-alternatives --set php /usr/bin/php${{ matrix.php }}
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: v2 test suites
        run: |
          set -e
          for f in tests/v2/*.php; do
            echo "::group::$f"
            php "$f"
            echo "::endgroup::"
          done
      - name: Release-source guards
        run: |
          test -f LICENSE
          test -f version.xml
          grep -q '<application>chatwootIntegration</application>' version.xml
          grep -q 'SPDX-License-Identifier: GPL-3.0-or-later' LICENSE
